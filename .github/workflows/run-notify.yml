name: Run Notifications

# Emails one short message per run of every other workflow here, success or
# failure — the ten scrapers plus the combined-workbook build and the two email
# jobs.
#
# This listens for their *completion* rather than adding a notify step to each:
# one file to maintain instead of thirteen, and it also catches runs that die
# before reaching a final step (a cancelled job, or a runner that times out
# mid-scrape) — a step inside the workflow would itself be skipped in exactly
# those cases.
#
# Notes:
#   • `workflow_run` only ever runs the copy of this file on the default branch,
#     and only fires for workflows that also exist there, so this cannot be
#     tested from a pull-request branch.
#   • This workflow is deliberately absent from its own list: a workflow_run
#     trigger on itself would recurse.

on:
  workflow_run:
    workflows:
      - Monthly ISCC Certificate Scraper
      - Monthly SURE Certificate Scraper
      - Monthly PEFC Certificate Scraper
      - Monthly FSC Certificate Scraper
      - Monthly GLOBALG.A.P Certificate Scraper
      - Monthly GGL Certificate Scraper
      - Monthly SBP Certificate Scraper
      - Monthly RSPO Member Scraper
      - Monthly FSSC Certificate Scraper
      - Monthly ENplus Producer Scraper
      - Monthly Combined Workbook
      - Monthly CSV Email Digest
      - Email Combined Workbook
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read           # read the finished run's jobs and logs

    steps:
      - name: Compose the notification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER: ${{ github.event.workflow_run.event }}
          STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          # Every probe below is best-effort, so `-e` and `pipefail` must BOTH be
          # off. Actions runs steps as `bash -e {0}`, and `set -uo pipefail` does
          # not clear that: with pipefail on, a `grep` that simply finds nothing
          # returns 1, the pipeline returns 1, the assignment returns 1, and -e
          # kills the step. That is exactly how the first GLOBALG.A.P
          # notification died — its log has no "Parsed …" line, so the very first
          # grep found nothing and the step aborted before reaching the fallback
          # patterns. Scrapers whose logs do match sailed through, which is why
          # it survived the ISCC smoke test.
          set +e +o pipefail -u

          gh run view "$RUN_ID" -R "$REPO" --log > run.log 2>/dev/null || : > run.log
          # `gh run view --log` prefixes every line with "job<TAB>step<TAB>", then
          # an optional BOM and an ISO timestamp.
          unprefix() { sed -E 's/^([^\t]*\t){2}//; s/^\xef\xbb\xbf//; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //'; }

          # Each job announces its own tally, in its own words: most scrapers say
          # "Parsed 750 certificate holders (429 Active).", GLOBALG.A.P "Wrote 99
          # rows → …", the combined build "Building dashboard: N rows, …", the
          # CSV digest "Wrote …zip — 8 CSVs, 11.2 MB". First pattern to hit wins.
          COUNT=""
          for pat in 'Parsed [0-9]+ [a-z ]+' 'Wrote [0-9]+ rows' \
                     'Building dashboard: [0-9]+ rows' '[0-9]+ CSVs, [0-9.]+ MB'; do
            [ -n "$COUNT" ] && break
            COUNT=$(grep -hoE "$pat" run.log | tail -1)
          done
          COUNT=$(printf '%s' "$COUNT" | sed -E 's/^(Parsed|Wrote) //; s/^Building dashboard: //; s/ *$//')
          RESULT=$(grep -hE 'Parsed [0-9]|Wrote [0-9]+ rows|Building dashboard: [0-9]|[0-9]+ CSVs, [0-9.]+ MB' \
                   run.log | tail -1 | unprefix)
          COMMIT=$(grep -hoE '(chore: [a-z][^"]*[0-9]{4}-[0-9]{2}-[0-9]{2}|No changes to commit)' run.log | tail -1)

          FAILED_STEP=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | first // ""' 2>/dev/null)

          if [ "$CONCLUSION" = "success" ]; then ICON="✅"; else ICON="❌"; fi

          {
            echo "$RUN_NAME — $CONCLUSION"
            echo
            echo "  Result:  ${RESULT:-(no count line in the log)}"
            echo "  Commit:  ${COMMIT:-(nothing committed)}"
            [ -n "${FAILED_STEP:-}" ] && echo "  Failed:  at step \"$FAILED_STEP\""
            echo "  Trigger: $TRIGGER"
            echo "  Started: $STARTED"
            echo "  Run:     $RUN_URL"
            if [ -n "${FAILED_STEP:-}" ]; then
              # Column 2 of the log is the step name, so the failing step's own
              # output can be quoted without the surrounding job noise.
              TAIL=$(awk -F'\t' -v s="$FAILED_STEP" 'NF>2 && $2==s {print $3}' run.log |
                     sed -E 's/^\xef\xbb\xbf//; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' |
                     grep -vE '^(##\[|\[command\]|\[36;1m|[[:space:]]*$)' | tail -12)
              if [ -n "$TAIL" ]; then
                echo
                echo "Last lines of that step:"
                echo "$TAIL" | sed 's/^/    /'
              fi
            fi
            echo
            echo "Automated message — do not reply."
          } > body.txt

          {
            echo "SUBJECT=[scrapers] $ICON $RUN_NAME${COUNT:+ — $COUNT}"
            echo "BODY<<EOF_NOTIFY_BODY"
            cat body.txt
            echo "EOF_NOTIFY_BODY"
          } >> "$GITHUB_ENV"

      # If composing the message ever dies again, the mail must still go out —
      # a notifier that fails silently is the one thing this cannot be. The step
      # above stays failed, so the bad run is still visible in the Actions tab.
      - name: Fall back to a bare notification
        if: failure()
        env:
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$CONCLUSION" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          {
            echo "SUBJECT=[scrapers] $ICON $RUN_NAME"
            echo "BODY<<EOF_NOTIFY_BODY"
            echo "$RUN_NAME — $CONCLUSION"
            echo
            echo "Composing the full summary failed, so this is the bare notification."
            echo
            echo "  Run:     $RUN_URL"
            echo
            echo "Automated message — do not reply."
            echo "EOF_NOTIFY_BODY"
          } >> "$GITHUB_ENV"

      - name: Send email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: maris.zamovskis@bmcertification.com
          from: Certificate Scrapers <${{ secrets.MAIL_USERNAME }}>
          subject: ${{ env.SUBJECT }}
          # Plain text, no attachment: a Gmail-sent attachment to a Microsoft 365
          # inbox gets quarantined silently (see the README's email notes).
          body: ${{ env.BODY }}
