name: Monthly ENplus Producer Scraper

on:
  schedule:
    - cron: '0 14 1 * *'   # 14:00 UTC on the 1st of every month (after the others)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run scraper
        run: python scraper_enplus.py

      - name: Generate Excel dashboard
        run: python generate_excel_enplus.py

      - name: Commit and push Excel files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch "ENplus certificates"*.csv
          git add "ENplus certificates"*.xlsx
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: monthly ENplus producer scrape $(date -u +%Y-%m-%d)"
          # Sibling scrape workflows commit to master while this one runs, so a
          # plain push can lose the whole scrape to a non-fast-forward rejection
          # (that is how the GLOBALG.A.P run of 2026-08-01 was thrown away).
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt/3) — rebasing onto origin/master …"
            git pull --rebase --autostash origin master
          done
          git push
