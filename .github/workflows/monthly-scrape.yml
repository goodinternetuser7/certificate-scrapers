name: Monthly ISCC Certificate Scraper

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of every month
  workflow_dispatch:        # allow manual runs from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the xlsx back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Generate Excel dashboard
        run: python generate_excel.py

      - name: Commit and push Excel files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage xlsx files; remove any stale csvs that may be left in the repo
          git rm -f --ignore-unmatch "ISCC certificates"*.csv
          git add "ISCC certificates"*.xlsx
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: monthly ISCC certificate scrape $(date -u +%Y-%m-%d)"
          # Sibling scrape workflows commit to master while this one runs, so a
          # plain push can lose the whole scrape to a non-fast-forward rejection
          # (that is how the GLOBALG.A.P run of 2026-08-01 was thrown away).
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt/3) — rebasing onto origin/master …"
            git pull --rebase --autostash origin master
          done
          git push
